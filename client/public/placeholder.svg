<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <g transform="translate(400, 270)" text-anchor="middle">
    <!-- Cabin Roof -->
    <path d="M-80 -10 L0 -80 L80 -10 Z" fill="none" stroke="#14b8a6" stroke-width="8" stroke-linejoin="round"/>
    <!-- Cabin Body -->
    <rect x="-60" y="-10" width="120" height="90" fill="none" stroke="#14b8a6" stroke-width="6" rx="4"/>
    <!-- Door -->
    <rect x="-18" y="20" width="36" height="60" fill="#14b8a6" opacity="0.3" stroke="#14b8a6" stroke-width="4"/>
    <!-- Window -->
    <circle cx="0" cy="-35" r="16" fill="#14b8a6" opacity="0.4" stroke="#14b8a6" stroke-width="4"/>
    <!-- Text -->
    <text x="0" y="140" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" letter-spacing="1">Pocono.Vacations</text>
    <text x="0" y="170" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Luxury Cabin Rental</text>
  </g>
</svg>
